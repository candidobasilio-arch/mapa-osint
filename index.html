<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    /* Variables actualizadas para modo oscuro */
    --bg:#12141c; --ink:#ffffff; --muted:#8a93a6; --line:#2b313c;
    --base:#1F9FD6; --ing:#28A95C; --ana:#8157E6; --ges:#E8338A; --lid:#E8870D; --neg:#EF4B2C;
    --hub:#2b313c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--ink); font-family:"Nunito",system-ui,sans-serif; overflow:hidden;}
  header{position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:baseline; gap:12px; padding:20px 26px;}
  .title{font-size:18px; font-weight:700; letter-spacing:.01em; color:var(--ink)}
  .title b{color:var(--base)}
  #stage{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; z-index:1}
  .hint{position:fixed; bottom:22px; left:0; right:0; text-align:center; z-index:5;
    font-size:12.5px; font-weight:600; color:var(--muted); pointer-events:none;}
  .hint span{color:var(--ink)}
  .controls{position:fixed; bottom:18px; right:22px; z-index:6; display:flex; gap:8px}
  .controls button{
    font-family:inherit; font-size:12px; font-weight:700; color:var(--muted);
    background:var(--bg); border:1.5px solid var(--line); border-radius:999px; padding:8px 14px; cursor:pointer;}
  .controls button:hover{color:var(--ink); border-color:#cfd6e2}

  .node{cursor:pointer; outline:none}
  .node text{font-family:inherit; letter-spacing:.01em; pointer-events:none; user-select:none}
  .node .hexbody{transition:stroke .15s ease, fill .15s ease}
  .node.course:hover .hexbody,.node:focus-visible .hexbody{stroke:#e2e8f0}
  .node.hub{cursor:default}
  .course-actions{display:flex; flex-direction:column; align-items:center; gap:5px; font-family:"Nunito",system-ui,sans-serif}
  .course-actions button{font:600 12px/13px "Nunito",system-ui,sans-serif; cursor:pointer; color:#e2e8f0; border:0; border-radius:5px}
  .details-button{width:104px; height:23px; background:transparent; text-decoration:underline; text-underline-offset:3px}
  .complete-button{width:100px; height:28px; background:#293140}
  .course-actions button:hover{background:#354155}
  button:focus-visible{outline:2px solid #e2e8f0; outline-offset:2px}
  #course-detail{position:fixed; z-index:9; width:min(360px,calc(100vw - 32px)); max-height:calc(100dvh - 32px);
    overflow:auto; background:#1b202b; border:1px solid #394253; border-radius:14px; padding:24px;
    box-shadow:0 16px 48px #0005; color:var(--ink)}
  #course-detail[hidden]{display:none}
  .detail-category{margin:0 28px 12px 0; font-size:12px; font-weight:700; letter-spacing:.01em}
  #detail-title{margin:0 20px 12px 0; font-size:21px; font-weight:700; letter-spacing:.01em; line-height:1.3}
  #detail-description{margin:0; color:#bdc5d2; font-size:16px; line-height:1.65; overflow-wrap:anywhere}
  #detail-close{position:absolute; top:10px; right:10px; width:32px; height:32px; border:0; border-radius:6px;
    background:transparent; color:#bdc5d2; font-size:24px; cursor:pointer}
  #detail-close:hover{background:#293140; color:#fff}
  @media (max-width:600px){header{padding:16px}.title{font-size:15px}.controls{right:16px;bottom:16px}}
  @media (prefers-reduced-motion:reduce){.node .hexbody{transition:none}}
</style>
</head>
<body>
  <header>
    <span class="title"><b>OSINT</b> · Mapa de competencias</span>
  </header>

  <svg id="stage" aria-label="Mapa interactivo de competencias OSINT"></svg>
  <section id="course-detail" role="dialog" aria-modal="false" aria-labelledby="detail-title" aria-describedby="detail-description" hidden>
    <button id="detail-close" type="button" aria-label="Cerrar detalle">×</button>
    <p class="detail-category" id="detail-category"></p>
    <h2 id="detail-title"></h2>
    <p id="detail-description"></p>
  </section>
 
  <div class="controls"><button id="reset">Reiniciar progreso</button></div>

const PILLAR_BY_ID = Object.fromEntries(FRAMEWORK.pillars.map(p=>[p.id,p]));

/* ===== ESTADO DE PROGRESO (se guarda en el navegador) ===== */
const TOTAL_COURSES = FRAMEWORK.pillars.reduce((n,p)=>n+p.courses.length,0); // 36
const STORE_KEY = "osint_progress_v1";
let completed = (function(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } })();
function saveProgress(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(completed)); }catch(e){} }
function isDone(id){ return !!completed[id]; }
function doneCount(){ return FRAMEWORK.pillars.reduce((n,p)=> n + p.courses.filter(c=>completed[c.id]).length, 0); }
function donePillar(pid){ return PILLAR_BY_ID[pid].courses.filter(c=>completed[c.id]).length; }
function chipText(d){ return donePillar(d.ref.id)+" / 6"; }

const BORDER_STYLES = {
  base:{w:4,dash:"none",cap:"butt"},
  lid:{w:1.5,dash:"none",cap:"butt",dbl:true},
  ing:{w:2.5,dash:"2, 5",cap:"round"},
  ges:{w:4,dash:"0, 9",cap:"round"},
  ana:{w:1.5,dash:"none",cap:"butt"},
  neg:{w:2,dash:"8, 5",cap:"butt"}
};

function appendHexBody(container,r,pid,fill,stroke,borderScale=1){
  const style=BORDER_STYLES[pid];
  const width=Math.max(style.w*borderScale,borderScale>1?3:0);
  container.append("polygon").attr("class","hexbody").attr("points",hexPoints(r))
    .attr("fill",fill).attr("stroke",stroke).attr("stroke-width",width)
    .attr("stroke-dasharray",style.dash).attr("stroke-linecap",style.cap);
  if(style.dbl){
    const inset=borderScale>1?width+4:5;
    container.append("polygon").attr("points",hexPoints(r-inset)).attr("fill","none")
      .attr("stroke",stroke).attr("stroke-width",width).attr("pointer-events","none");
  }
}

function hexPoints(r){ let p=[]; for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i); p.push((r*Math.cos(a)).toFixed(2)+","+(r*Math.sin(a)).toFixed(2)); } return p.join(" "); }
const HUB_R=86, PILLAR_R=82, COURSE_R=82;

// Cuadrícula hexagonal de lados horizontales: cada celda tiene un lugar único.
const CELL_R=90;
const slotCell={top:[0,-1],ur:[1,-1],lr:[1,0],bottom:[0,1],ll:[-1,1],ul:[-1,0]};
const slotTurn={top:0,ur:1,lr:2,bottom:3,ll:4,ul:5};
function cellPosition(q,r){ return {x:1.5*CELL_R*q, y:Math.sqrt(3)*CELL_R*(r+q/2)}; }
function rotateCell(q,r,turns){
  for(let i=0;i<turns;i++) [q,r]=[-r,q+r];
  return cellPosition(q,r);
}
// Seis cursos por sector, en filas de panal que crecen hacia afuera.
const COURSE_CELLS=[[0,-2],[1,-2],[-1,-2],[0,-3],[1,-3],[2,-4]];
const hubNode={id:"__hub",type:"hub",r:HUB_R,x:0,y:0};
const nodes=[hubNode];
const coursePositions={};
FRAMEWORK.pillars.forEach(p=>{
  const [q,r]=slotCell[p.slot];
  nodes.push({id:p.id,type:"pillar",r:PILLAR_R,ref:p,...cellPosition(q,r),expanded:false});
  p.courses.forEach((c,i)=>{
    const [cq,cr]=COURSE_CELLS[i];
    coursePositions[c.id]={r:COURSE_R,...rotateCell(cq,cr,slotTurn[p.slot])};
  });
});
// Reservar el espacio de todos los cursos mantiene fijo el encuadre al abrirlos.
const layoutBounds=[...nodes,...Object.values(coursePositions)];

/* ===== SVG Y DEFINICIONES ===== */
const svg=d3.select("#stage");

/* ===== FONDO ESTÁTICO: el SVG transparente muestra el color de body (--bg). ===== */

/* ===== CONTENEDOR PRINCIPAL ===== */
// Se muestra una vez calculadas las posiciones y el encuadre inicial.
const root = svg.append("g").attr("visibility", "hidden");

const gNodes=root.append("g");

const zoom=d3.zoom().scaleExtent([0.45,2.2]).on("zoom", e=> root.attr("transform", e.transform));
svg.call(zoom);

function fitView(animate=true){
  const margin=8;
  const left=d3.min(layoutBounds,n=>n.x-n.r-margin);
  const right=d3.max(layoutBounds,n=>n.x+n.r+margin);
  const top=d3.min(layoutBounds,n=>n.y-n.r-margin);
  const bottom=d3.max(layoutBounds,n=>n.y+n.r+margin);
  const b={x:left,y:top,width:right-left,height:bottom-top};
  if (b.width === 0) return; // Protección contra medidas en 0
  const W=svg.node().clientWidth, H=svg.node().clientHeight, pad=48;
  const k=Math.min(2.2, Math.max(0.45, Math.min(W/(b.width+pad*2), H/(b.height+pad*2))));
  const tx=W/2-k*(b.x+b.width/2), ty=H/2-k*(b.y+b.height/2);
  const transform=d3.zoomIdentity.translate(tx,ty).scale(k);
  svg.interrupt();
  if(animate){
    svg.transition().duration(550).call(zoom.transform, transform);
  } else {
    svg.call(zoom.transform, transform);
  }
}

function wrapLines(text, max){
  const words=text.split(/\s+/); const lines=[]; let cur="";
  words.forEach(w=>{ const t=cur?cur+" "+w:w; if(t.length>max && cur){ lines.push(cur); cur=w; } else cur=t; });
  if(cur) lines.push(cur);
  if(lines.length>3){ lines.length=3; lines[2]=lines[2].replace(/.{0,2}$/,"…"); }
  return lines;
}

/* ===== RENDERIZADO ===== */
let nodeSel;
function render(){

  nodeSel=gNodes.selectAll("g.node").data(nodes, d=>d.id);
  nodeSel.exit().remove();
  const enter=nodeSel.enter().append("g")
    .attr("class", d=> "node "+d.type)
    .attr("tabindex", d=> d.type==="hub"?null:0)
    .attr("role", d=> d.type==="hub"?null:"button")
    .each(function(d){ buildNode(d3.select(this), d); });
    
  enter.filter(d=>d.type==="pillar").on("click",(e,d)=>togglePillar(d))
    .on("keydown",(e,d)=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault(); togglePillar(d);} });
  enter.filter(d=>d.type==="course")
    .on("click",function(e,d){ flipCourse(this,d); })
    .on("keydown",function(e,d){
      if(e.target!==this) return;
      if(e.key==="Enter"||e.key===" "){e.preventDefault(); flipCourse(this,d);}
    });

  nodeSel=enter.merge(nodeSel);
  nodeSel.filter(d=>d.type==="pillar")
    .attr("aria-expanded",d=>String(d.expanded))
    .attr("aria-label",d=>`${d.ref.name}, ${donePillar(d.id)} de 6 cursos completados`)
    .select("text.cnt").text(d=>chipText(d));

}

function buildNode(sel,d){
  const content=sel.append("g").attr("class","node-content");
  if(d.type==="hub"){
    content.append("polygon").attr("class","hexbody").attr("points",hexPoints(HUB_R))
      .attr("fill","#202631").attr("stroke","var(--bg)").attr("stroke-width",6);
    content.append("polygon").attr("points",hexPoints(HUB_R-8)).attr("fill","none")
      .attr("stroke","var(--bg)").attr("stroke-width",2)
      .attr("pointer-events","none");
    content.append("text").attr("text-anchor","middle").attr("y",-21)
      .attr("fill","#f1f5f9").attr("font-size",34).attr("font-weight",700).text(FRAMEWORK.hub.label);
    const sub=content.append("text").attr("text-anchor","middle").attr("fill","#a4aebe")
      .attr("font-size",12).attr("font-weight",600);
    ["UNIDAD DE","INTELIGENCIA","CIBERNÉTICA"].forEach((line,i)=>sub.append("tspan").attr("x",0).attr("y",i*14).text(line));
    content.append("text").attr("class","hub-count").attr("text-anchor","middle").attr("y",53)
      .attr("fill","#f1f5f9").attr("font-size",16).attr("font-weight",700);
    return;
  }
  if(d.type==="pillar"){
    const p=d.ref;
    appendHexBody(content,PILLAR_R,p.id,p.hex,"var(--bg)",1.5);
    content.append("text").attr("text-anchor","middle").attr("y",-4).attr("fill","#f1f5f9")
      .attr("font-size",19).attr("font-weight",700).text(p.name);
    content.append("text").attr("class","cnt").attr("text-anchor","middle").attr("y",23)
      .attr("fill","#d1dae4").attr("font-size",15).attr("font-weight",600).text(chipText(d));
    return;
  }
  d.flipped=false;
  renderCourseFace(content.append("g").attr("class","flip-wrap"),d);
}

function renderCourseFace(wrap,d){
  const p=PILLAR_BY_ID[d._pid], done=isDone(d.ref.id);
  wrap.selectAll("*").remove();
  const node=gNodes.selectAll("g.node.course").filter(n=>n===d);
  node.attr("role",d.flipped?"group":"button")
    .attr("aria-label",`${d.ref.short}, ${done?"completado":"pendiente"}. ${d.flipped?"Acciones del curso":"Voltear para ver acciones"}`);
  appendHexBody(wrap,COURSE_R,p.id,"var(--bg)",p.hex);
  if(!d.flipped){
    const lines=wrapLines(d.ref.short,14);
    const label=wrap.append("text").attr("text-anchor","middle").attr("fill","#e7ecf3")
      .attr("font-size",18).attr("font-weight",700);
    lines.forEach((line,i)=>label.append("tspan").attr("x",0).attr("y",6-(lines.length-1)*11+i*22).text(line));
  } else {
    wrap.append("g").attr("transform","translate(-27,-52) scale(2.25)")
      .attr("fill","none").attr("stroke",p.hex).attr("stroke-width",1.4)
      .attr("stroke-linecap","round").attr("stroke-linejoin","round").attr("aria-hidden","true")
      .attr("pointer-events","none").html(COURSE_ICONS[d.ref.id]||DEFAULT_ICON);
    const actions=wrap.append("foreignObject").attr("x",-54).attr("y",-3).attr("width",108).attr("height",58)
      .append("xhtml:div").attr("class","course-actions");
    // Los botones reciben el foco y detienen la propagación para no voltear la carta.
    actions.on("click",e=>e.stopPropagation()).on("keydown",e=>e.stopPropagation())
      .on("pointerdown",e=>e.stopPropagation()).on("mousedown",e=>e.stopPropagation())
      .on("touchstart",e=>e.stopPropagation());
    actions.append("xhtml:button").attr("type","button").attr("class","details-button")
      .attr("aria-haspopup","dialog").attr("aria-controls","course-detail").attr("aria-expanded","false")
      .text("Ver detalle").on("click",function(){ openDetail(d,this); });
    const complete=actions.append("xhtml:button").attr("type","button").attr("class","complete-button")
      .attr("aria-pressed",String(done)).attr("aria-label",done?"Desmarcar como completado":"Marcar como completado");
    complete.append("xhtml:span").text(done?"Desmarcar":"Marcar como");
    complete.append("xhtml:br");
    complete.append("xhtml:span").text("completado");
    complete.on("click",function(){
      const focused=document.activeElement===this;
      toggleDone(d);
      if(focused) node.select(".complete-button").node()?.focus();
    });
  }
  if(done){
    wrap.append("path").attr("d","M32 -42l4 4 8-9").attr("fill","none").attr("stroke",p.hex)
      .attr("stroke-width",2).attr("stroke-linecap","round").attr("stroke-linejoin","round")
      .attr("pointer-events","none").attr("aria-hidden","true");
  }
}

/* Marca/desmarca un curso y actualiza color, hub y avance del pilar */
function toggleDone(d){
  completed[d.ref.id] = !completed[d.ref.id];
  saveProgress();
  gNodes.selectAll("g.node.course").filter(n=> n===d)
    .each(function(n){ renderCourseFace(d3.select(this).select("g.flip-wrap"), n); });
  updatePillarChip(d._pid);
  updateHub();
}

/* Actualiza el chip "X/6" de un pilar */
function updatePillarChip(pid){
  gNodes.selectAll("g.node.pillar").filter(n=> n.id===pid)
    .attr("aria-label",d=>`${d.ref.name}, ${donePillar(pid)} de 6 cursos completados`)
    .select("text.cnt").text(n=> chipText(n));
}

/* El progreso se comunica con un contador, sin rellenos ni animación. */
function updateHub(){
  gNodes.selectAll(".hub-count").text(doneCount()+" / "+TOTAL_COURSES);
}

/* Anima el "volteo de carta": cierra horizontalmente, intercambia la cara y abre */
function flipCourse(nodeEl, d){
  const wrap = d3.select(nodeEl).select("g.flip-wrap");
  if(wrap.empty()) return;
  closeDetail(false);
  d.flipped = !d.flipped;
  const keyboardFocus=document.activeElement===nodeEl;
  function drawFace(){
    renderCourseFace(wrap,d);
    if(keyboardFocus && d.flipped) d3.select(nodeEl).select(".details-button").node()?.focus();
  }
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    wrap.interrupt().attr("transform","scale(1,1)"); drawFace(); return;
  }
  wrap.interrupt()
    .transition().duration(160).ease(d3.easeCubicIn)
    .attr("transform","scale(0.02,1)")
    .on("end", function(){
      drawFace();
      wrap.transition().duration(150).ease(d3.easeCubicOut)
        .attr("transform","scale(1,1)");
    });
}

function ticked(){
  nodeSel && nodeSel.attr("transform", d=> `translate(${d.x},${d.y})`);
}

function togglePillar(d){ d.expanded ? collapse(d) : expand(d); }
function expand(d){
  closeDetail(false);
  // Cada categoría se abre de forma independiente en sus celdas reservadas.
  if(d.expanded) return;
  d.expanded=true; const p=d.ref;
  p.courses.forEach(c=>{
    nodes.push({id:p.id+"::"+c.id,type:"course",ref:c,_pid:p.id,...coursePositions[c.id]});
  });
  refresh();
}

function collapse(d){
  closeDetail(false);
  d.expanded=false; const pref=d.ref.id+"::";
  for(let i=nodes.length-1;i>=0;i--) if(nodes[i].id.startsWith(pref)) nodes.splice(i,1);
  refresh();
}
function refresh(){
  render();
  ticked();
}

const detail=document.getElementById("course-detail");
let detailAnchor=null;
function positionDetail(){
  if(detail.hidden || !detailAnchor) return;
  const anchor=detailAnchor.closest("g.node").getBoundingClientRect();
  const width=detail.offsetWidth, height=detail.offsetHeight;
  const W=window.innerWidth,H=window.innerHeight,gap=16;
  let x=anchor.right+gap;
  if(x+width>W-gap) x=anchor.left-width-gap;
  let y=anchor.top;
  if(W<600){ x=(W-width)/2; y=H-height-gap; }
  detail.style.left=Math.max(gap,Math.min(x,W-width-gap))+"px";
  detail.style.top=Math.max(gap,Math.min(y,H-height-gap))+"px";
}
function openDetail(d,anchor){
  closeDetail(false);
  const p=PILLAR_BY_ID[d._pid];
  detailAnchor=anchor;
  document.getElementById("detail-category").textContent=p.name;
  document.getElementById("detail-category").style.color=p.hex;
  document.getElementById("detail-title").textContent=d.ref.short;
  document.getElementById("detail-description").textContent=d.ref.long;
  detail.hidden=false;
  anchor.setAttribute("aria-expanded","true");
  positionDetail();
  document.getElementById("detail-close").focus();
}
function closeDetail(restoreFocus=true){
  if(detail.hidden) return;
  detail.hidden=true;
  const anchor=detailAnchor;
  detailAnchor=null;
  if(anchor?.isConnected){
    anchor.setAttribute("aria-expanded","false");
    if(restoreFocus) anchor.focus();
  }
}
document.getElementById("detail-close").addEventListener("click",()=>closeDetail());
document.addEventListener("pointerdown",e=>{
  if(!detail.hidden && !detail.contains(e.target) && e.target!==detailAnchor) closeDetail(false);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && !detail.hidden){ e.preventDefault(); closeDetail(); }
});
window.addEventListener("resize",()=>{closeDetail(false);fitView(false);});

// Mostrar el panal ya colocado y centrado, sin simulación ni rebotes.
render();
ticked();
fitView(false);
root.attr("visibility", "visible");
updateHub();

// Botón: reiniciar progreso
const resetBtn = document.getElementById("reset");
if(resetBtn){
  resetBtn.onclick = ()=>{
    closeDetail(false);
    completed = {}; saveProgress();
    gNodes.selectAll("g.node.course").each(function(n){ renderCourseFace(d3.select(this).select("g.flip-wrap"), n); });
    FRAMEWORK.pillars.forEach(p=> updatePillarChip(p.id));
    updateHub();
  };
}
</script>
